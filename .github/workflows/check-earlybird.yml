name: Seoul Flight Check — 早割（60〜150日後）

on:
  schedule:
    - cron: "0 22 1,15 * *"   # 毎月1日・15日 07:00 JST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price history DB
        uses: actions/cache@v4
        with:
          path: prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: |
            prices-db-

      - name: Run early-bird check
        env:
          SERPAPI_KEY:     ${{ secrets.SERPAPI_KEY }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          ALERT_TO:        ${{ secrets.ALERT_TO }}
          THRESHOLD_GREAT: ${{ vars.THRESHOLD_GREAT || '18000' }}
          THRESHOLD_BUY:   ${{ vars.THRESHOLD_BUY || '25000' }}
          DAYS_START:      "60"
          DAYS_AHEAD:      "150"
          DAYS_STEP:       "14"
          TRIP_DURATIONS:  "2,3"
        run: python flight_checker.py

      - name: Generate HTML report
        env:
          THRESHOLD_GREAT: ${{ vars.THRESHOLD_GREAT || '18000' }}
          THRESHOLD_BUY:   ${{ vars.THRESHOLD_BUY || '25000' }}
        run: |
          mkdir -p public
          python flight_checker.py --report public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: "Update flight price report (early-bird)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-log-earlybird-${{ github.run_number }}
          path: flight_checker.log
          retention-days: 7
